    <div class="main">
        <header class="topbar">
            <button class="menu-btn" id="menuBtn" aria-label="Open menu">&#9776;</button>
            <form class="search" role="search">
                <input type="search" placeholder="Search for products, events..." aria-label="Search">

                <button class="mark-all" id="markAll">&#10004; Mark All as Read</button>
